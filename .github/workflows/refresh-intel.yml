name: Refresh stock intel (nightly)

# 每周日深夜用 DeepSeek 直调刷新 12 只个股情报 + 9 个行业政策,结果提交进
# data/intel.json —— 云端/本地 app 直接读取该共享层。
# cron 刻意排在低使用时段(北京周一凌晨):① push 会触发 Streamlit Cloud 重启;
# ② 避开 DeepSeek 高峰时段(北京 9-12/14-18 为常规价 2 倍)。
# 需要仓库 Secret: DEEPSEEK_API_KEY (Settings → Secrets and variables → Actions)
on:
  schedule:
    - cron: "0 21 * * 0"         # 周日 21:00 UTC = 北京周一 05:00
  workflow_dispatch: {}           # 也可在 Actions 页手动触发

permissions:
  contents: write

concurrency:
  group: refresh-intel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet openai requests
      - name: Refresh intel (DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          REFRESH_DAYS: "6"
        run: python scripts/refresh_intel.py
      - name: Commit if changed
        if: always()               # 脚本部分失败也提交已成功的条目(逐条落盘)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/        # 目录 pathspec：文件缺失不会 fatal，增删改全纳入
          if git diff --quiet --cached; then
            echo "no change — skipping commit"
          else
            git commit -m "chore: nightly refresh stock intel [skip ci]"
            git pull --rebase origin master   # 防与快照 Action 并发推送冲突
            git push
          fi
